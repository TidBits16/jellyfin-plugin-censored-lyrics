<!DOCTYPE html>
<html lang="en">
<head>
    <title>Censored Lyrics</title>
</head>
<body>
    <div id="censoredLyricsConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-select,emby-textarea">
        <style>
            #censoredLyricsConfigurationPage #words {
                min-height: 16em;
            }
            #censoredLyricsConfigurationPage details {
                margin: 0.5em 0 1.5em;
            }
            #censoredLyricsConfigurationPage summary {
                cursor: pointer;
                font-size: 1.15em;
                padding: 0.75em 0;
            }
            #censoredLyricsConfigurationPage #forceButton {
                background: #c62828;
                color: #fff;
            }
            #censoredLyricsConfigurationPage .actions {
                display: flex;
                gap: 0.75em;
            }
            #censoredLyricsConfigurationPage #runStatus:empty {
                display: none;
            }
            #censoredLyricsConfigurationPage #runStatus {
                margin: 0 0 1em;
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <form class="configForm">
                    <div class="inputContainer">
                        <textarea is="emby-textarea" id="words" label="Words" spellcheck="false"></textarea>
                    </div>
                    <div class="selectContainer">
                        <select is="emby-select" id="style" label="Censor">
                            <option value="None">beans</option>
                            <option value="FirstLetter">b****</option>
                            <option value="WholeWord">*****</option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <select is="emby-select" id="mask" label="Characters">
                            <option value="Asterisk">* asterisks</option>
                            <option value="Hash"># roblox</option>
                            <option value="Symbols">@#? random symbols</option>
                        </select>
                    </div>
                    <details>
                        <summary>Advanced</summary>
                        <button is="emby-button" type="button" id="forceButton" class="raised block emby-button">
                            <span>Force Refresh all Lyrics</span>
                        </button>
                    </details>
                    <div id="runStatus"></div>
                    <div class="actions">
                        <button is="emby-button" type="button" id="applyButton" class="raised button-submit emby-button">
                            <span>Apply</span>
                        </button>
                        <button is="emby-button" type="button" id="saveButton" class="raised emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var CensoredLyricsConfiguration = {
                pluginId: "d045e257-f274-46e5-a2a7-b88f72c725e9",
                pollTimer: 0,

                alphabet: function (mask) {
                    if (mask === "Hash") return "#";
                    if (mask === "Symbols") return "@#?";
                    return "*";
                },

                preview: function (style, mask) {
                    var sample = "beans";
                    if (style === "None") return sample;
                    var chars = CensoredLyricsConfiguration.alphabet(mask);
                    var text = "";
                    for (var i = 0; i < sample.length; i++) {
                        if (style === "FirstLetter" && i === 0) text += sample.charAt(0);
                        else text += chars.charAt((style === "FirstLetter" ? i - 1 : i) % chars.length);
                    }
                    return text;
                },

                refreshStyleLabels: function () {
                    var mask = document.getElementById("mask").value || "Asterisk";
                    ["None", "FirstLetter", "WholeWord"].forEach(function (style) {
                        var option = document.querySelector("#style option[value='" + style + "']");
                        if (option) option.textContent = CensoredLyricsConfiguration.preview(style, mask);
                    });
                },

                words: function () {
                    return document.getElementById("words").value
                        .split(/\r?\n/)
                        .map(function (line) { return line.trim(); })
                        .filter(function (word) { return word.length > 0; });
                },

                fill: function (config) {
                    document.getElementById("words").value = (config.Words || "").replace(/\r\n/g, "\n");
                    document.getElementById("style").value = config.Style || "FirstLetter";
                    document.getElementById("mask").value = config.Mask || "Asterisk";
                    CensoredLyricsConfiguration.refreshStyleLabels();
                },

                save: function () {
                    return ApiClient.getPluginConfiguration(CensoredLyricsConfiguration.pluginId).then(function (config) {
                        config.Words = CensoredLyricsConfiguration.words().join("\n");
                        config.Style = document.getElementById("style").value || "FirstLetter";
                        config.Mask = document.getElementById("mask").value || "Asterisk";
                        return ApiClient.updatePluginConfiguration(CensoredLyricsConfiguration.pluginId, config);
                    });
                },

                run: function (force) {
                    return CensoredLyricsConfiguration.save().then(function () {
                        return ApiClient.ajax({
                            type: "POST",
                            url: ApiClient.getUrl("CensoredLyrics/Run", { force: force }),
                            dataType: "json"
                        });
                    }).then(function () {
                        CensoredLyricsConfiguration.poll();
                    }, function () {
                        CensoredLyricsConfiguration.poll();
                    });
                },

                poll: function () {
                    if (CensoredLyricsConfiguration.pollTimer) {
                        clearTimeout(CensoredLyricsConfiguration.pollTimer);
                        CensoredLyricsConfiguration.pollTimer = 0;
                    }
                    ApiClient.getJSON(ApiClient.getUrl("CensoredLyrics/Status")).then(function (status) {
                        var el = document.getElementById("runStatus");
                        if (!el) return;
                        if (status.Error) el.textContent = status.Error;
                        else if (status.Total) el.textContent = status.Processed + " / " + status.Total;
                        else el.textContent = "";
                        ["applyButton", "saveButton", "forceButton"].forEach(function (id) {
                            var button = document.getElementById(id);
                            if (button) button.disabled = !!status.Running;
                        });
                        if (status.Running) {
                            CensoredLyricsConfiguration.pollTimer = setTimeout(CensoredLyricsConfiguration.poll, 1000);
                        }
                    });
                }
            };

            document.getElementById("mask").addEventListener("change", CensoredLyricsConfiguration.refreshStyleLabels);

            document.getElementById("censoredLyricsConfigurationPage").addEventListener("pageshow", function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(CensoredLyricsConfiguration.pluginId).then(function (config) {
                    CensoredLyricsConfiguration.fill(config);
                    Dashboard.hideLoadingMsg();
                    CensoredLyricsConfiguration.poll();
                });
            });

            document.getElementById("saveButton").addEventListener("click", function () {
                Dashboard.showLoadingMsg();
                CensoredLyricsConfiguration.save().then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                });
            });

            document.getElementById("applyButton").addEventListener("click", function () {
                CensoredLyricsConfiguration.run(false);
            });

            document.getElementById("forceButton").addEventListener("click", function () {
                CensoredLyricsConfiguration.run(true);
            });
        </script>
    </div>
</body>
</html>
