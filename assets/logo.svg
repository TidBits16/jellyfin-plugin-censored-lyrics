<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Censored LRCLIB">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="460" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a1644"/>
      <stop offset="1" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="note" x1="140" y1="120" x2="250" y2="380" gradientUnits="userSpaceOnUse">
