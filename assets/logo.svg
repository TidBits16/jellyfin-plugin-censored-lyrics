        <rect x="-2.1" y="-11" width="4.2" height="22" rx="1.4" transform="rotate(120)"/>
      </g>
    </symbol>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#aa5cc3" stroke-opacity="0.45" stroke-width="4"/>
  <circle cx="186" cy="248" r="128" fill="#aa5cc3" opacity="0.16"/>

  <g fill="url(#note)" filter="url(#glow)">
